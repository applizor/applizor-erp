name: Node.js CI

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Execute Server-Side Build & Deploy
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.APPLIZOR_IP }}
        username: ${{ secrets.APPLIZOR_USERNAME }}
        key: ${{ secrets.APPLIZOR_PEM_KEY }}
        command_timeout: 10m
        script: |
          set -e
          echo "🚀 Starting Zero-Downtime Deployment Process for iam.applizor.com..."
          
          TARGET_DIR="/home/admin/web/iam.applizor.com/public_html"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/applizor/applizor-erp.git"
          
          # STEP 1: Git operations directly as admin user (never chown away from admin:admin so Nginx stays 100% online)
          sudo -u admin git config --global --add safe.directory "$TARGET_DIR"
          cd "$TARGET_DIR"
          if [ ! -d .git ]; then sudo -u admin git init; fi
          sudo -u admin git remote remove origin || true
          sudo -u admin git remote add origin "$REPO_URL"
          
          # Fast Code Sync as admin
          sudo -u admin git fetch origin main
          sudo -u admin git reset --hard origin/main
          
          # STEP 2: Ensure containers are running
          sudo docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans
          
          # STEP 3: Run Database Migrations FIRST while existing backend is still serving traffic
          echo "🔄 Running migrations while online..."
          sudo docker compose -f docker-compose.prod.yml exec -T backend npx prisma migrate deploy || true
          
          # STEP 4: Fast Sequential Rolling Reload
          # 4A: Fast restart backend with 1s timeout
          echo "Restarting backend..."
          sudo docker compose -f docker-compose.prod.yml restart -t 1 backend
          
          echo "Waiting for backend container to be healthy..."
          for i in $(seq 1 40); do
            if sudo docker compose -f docker-compose.prod.yml exec -T backend node -e "process.exit(0)" > /dev/null 2>&1; then
              echo "✅ Backend container is ready in ${i}x0.5s!"
              break
            fi
            sleep 0.5
          done
          
          # 4B: Seed scripts
          echo "🌱 Seeding agent roles..."
          sudo docker compose -f docker-compose.prod.yml exec -T backend node dist/src/scripts/seed_agent_roles.js || echo "⚠️ Seed script non-critical"
          sudo docker compose -f docker-compose.prod.yml exec -T backend node dist/src/scripts/restore_sanket.js || echo "⚠️ Restore failed"
          
          # 4C: Fast restart frontend with 1s timeout
          echo "Restarting frontend..."
          sudo docker compose -f docker-compose.prod.yml restart -t 1 frontend
          
          echo "Waiting for frontend container to be healthy..."
          for i in $(seq 1 40); do
            if curl -s -f http://127.0.0.1:3000 > /dev/null 2>&1; then
              echo "✅ Frontend is ready in ${i}x0.5s!"
              break
            fi
            sleep 0.5
          done
          
          # STEP 5: Sync Static Assets for Host Nginx without taking site down
          echo "⏳ Syncing Static Assets for Nginx..."
          sudo rm -rf $TARGET_DIR/.next/static $TARGET_DIR/_next/static $TARGET_DIR/public
          sudo mkdir -p $TARGET_DIR/.next $TARGET_DIR/_next
          sudo docker cp applizor-frontend-prod:/app/.next/static $TARGET_DIR/.next/ || echo "Retrying static sync..."
          sudo docker cp applizor-frontend-prod:/app/public $TARGET_DIR/ || echo "Retrying public sync..."
          sudo cp -r $TARGET_DIR/.next/static $TARGET_DIR/_next/ || true
          
          # Ensure proper admin ownership
          sudo chown -R admin:admin $TARGET_DIR
          sudo chmod -R 755 $TARGET_DIR
          
          echo "✅ DEPLOYMENT SUCCESSFUL WITH ZERO DOWNTIME!"
